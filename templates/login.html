<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar | FinanTech RPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="description" content="Acesse o ambiente financeiro demonstrativo para testes RPA.">
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="bg-overlay">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
  </div>

  <main class="login-wrapper">
    <section class="login-card" aria-label="Formulário de Login">
      <div class="brand-row">
        <div class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </div>
        <span class="brand-name">FinanTech RPA</span>
      </div>

      <span class="badge-restricted">ACESSO RESTRITO • SETOR FINANCEIRO</span>
      <h1 class="login-title">Bem-vindo de volta</h1>
      <p class="login-subtitle">Entre para acessar o painel de faturamento e contas.</p>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="usuario">Usuário</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="login-test-data">
          <input id="confirmacaoDadosFicticios" type="checkbox" name="confirmacaoDadosFicticios" required />
          <label for="confirmacaoDadosFicticios">
            Usarei apenas dados fictícios nos testes.
            <span>Não é consentimento LGPD.</span>
          </label>
        </div>

        <div id="loginErro" class="login-error hidden" role="alert" aria-live="assertive"></div>

        <button type="submit" id="btnEntrar" class="btn-login">
          <span>Entrar no sistema</span>
          <span class="arrow">→</span>
        </button>
      </form>

      <footer class="login-footer">
        Ambiente demonstrativo para testes RPA com dados fictícios.
      </footer>
    </section>
  </main>

  <script src="../js/login.js" defer></script>
</body>
</html>
